<div class="registro-container animate__animated animate__fadeInUp">
  <div class="registro-card">
    <div class="card-header">
      <h2>Iniciar Sesión</h2>
      <p class="subtitle">Login de Prueba</p>
    </div>

    <form class="registro-form">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" class="form-input" placeholder="Usuario">
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" class="form-input" placeholder="Contraseña">
      </div>

      <div class="actions" style="display: flex; flex-direction: column; gap: 10px; margin-top: 20px;">
        <button type="submit" class="btn-registrar-full">Iniciar Sesión</button>
      </div>
    </form>
  </div>
</div>
